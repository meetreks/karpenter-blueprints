---
# Auto Mode variant. Uses Auto Mode's built-in 'default' NodeClass. See the
# self-managed variant (balanced-consolidation.yaml) for the full behavioral
# note on Balanced.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: balanced-consolidation
spec:
  template:
    metadata:
      labels:
        blueprint: balanced-consolidation
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values: ["2"]
        - key: eks.amazonaws.com/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "medium", "large"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
  limits:
    cpu: "100"
    memory: 400Gi
  disruption:
    consolidationPolicy: Balanced
    consolidateAfter: 30s
