---
# Auto Mode variant. Uses the built-in Auto Mode NodeClass (eks.amazonaws.com/v1)
# so no separate NodeClass is created here. The blueprint's own NodePool is named
# balanced-consolidation to coexist with default. See the self-managed variant
# (balanced-consolidation.yaml) for the full behavioral note on Balanced.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: balanced-consolidation
spec:
  template:
    metadata:
      labels:
        blueprint: balanced-consolidation
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
  limits:
    cpu: "100"
    memory: 400Gi
  disruption:
    consolidationPolicy: Balanced
    consolidateAfter: 30s
