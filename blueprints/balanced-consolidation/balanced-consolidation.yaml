apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
  limits:
    cpu: "100"
    memory: 400Gi
  disruption:
    # Balanced only takes a consolidation action when the estimated cost savings
    # are worth the disruption to running pods, measured via a per-action score.
    # Empty and clearly-underutilized nodes still consolidate; marginal actions
    # that under WhenEmptyOrUnderutilized would produce ~zero savings are skipped.
    consolidationPolicy: Balanced
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"
