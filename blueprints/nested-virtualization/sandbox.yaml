---
# ---------------------------------------------------------------------
# Agent tool sandbox — the Scope-B demo of nested virtualization.
#
# A tiny HTTP service that accepts POSTed Python code and executes it,
# running INSIDE a Kata Containers MicroVM. This is the pattern LLM
# agents use for tool calls when the tool needs to run arbitrary code:
# the sandbox has its own kernel, its own filesystem, and its own network
# namespace, so a bad tool call cannot escape into the host or the
# neighbour pods.
#
# The reason nested virtualization matters here is that Kata's shim
# needs KVM on the host to boot a guest kernel. Karpenter has provisioned
# a `*8i*` instance for us via cpuOptions.nestedVirtualization: enabled,
# which is the whole point of this blueprint.
# ---------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-app
data:
  server.py: |
    """Minimal Python-exec sandbox. Accepts POST /exec {"code": "..."} and
    returns { "stdout", "stderr", "exit_code" }. Deliberately unauthenticated:
    only reachable inside the cluster. Do NOT expose to the internet."""
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json, subprocess, os, sys, socket

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            if self.path != "/exec":
                self.send_response(404); self.end_headers(); return
            n = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(n) or b"{}")
            code = body.get("code", "")
            proc = subprocess.run(
                [sys.executable, "-c", code],
                capture_output=True, text=True, timeout=30,
            )
            resp = json.dumps({
                "stdout": proc.stdout,
                "stderr": proc.stderr,
                "exit_code": proc.returncode,
                "hostname": socket.gethostname(),
                "kernel": os.uname().release,
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(resp)))
            self.end_headers()
            self.wfile.write(resp)

        def log_message(self, format, *args):
            sys.stderr.write("%s - %s\n" % (self.address_string(), format % args))

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  labels:
    app: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      # This is the important bit — every pod created by this deployment
      # runs inside its own Kata MicroVM. If the exec'd code does anything
      # destructive it can only touch the ephemeral MicroVM.
      runtimeClassName: kata-qemu-runtime-rs
      nodeSelector:
        blueprint: nested-virtualization
      terminationGracePeriodSeconds: 5
      containers:
        - name: sandbox
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: app
          configMap:
            name: sandbox-app
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
spec:
  selector:
    app: sandbox
  ports:
    - port: 80
      targetPort: 8080
