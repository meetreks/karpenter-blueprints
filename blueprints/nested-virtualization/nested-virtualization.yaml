---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: nested-virt
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "<<KARPENTER_NODE_IAM_ROLE_NAME>>"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: <<CLUSTER_NAME>>
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: <<CLUSTER_NAME>>
  # cpuOptions.nestedVirtualization is a Karpenter v1.13+ field. Karpenter
  # forwards this into the launched instance's CpuOptions and additionally
  # rejects any instance type whose ProcessorInfo.SupportedFeatures does not
  # include "nested-virtualization". As of this blueprint, only the *8i*
  # families (c8i, m8i, r8i and -flex variants) report the feature.
  cpuOptions:
    nestedVirtualization: enabled
  tags:
    blueprint: nested-virtualization
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: nested-virt
spec:
  template:
    metadata:
      labels:
        blueprint: nested-virtualization
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: nested-virt
      # Explicit family pinning is not strictly required — Karpenter's
      # NestedVirtualizationFilter would narrow candidates for us — but
      # being explicit makes the blueprint's intent clear to readers and
      # keeps the pool from drifting onto a future non-8i family that
      # happens to also report the feature.
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c8i", "m8i", "r8i"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
