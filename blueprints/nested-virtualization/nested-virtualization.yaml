---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: nested-virt
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "<<KARPENTER_NODE_IAM_ROLE_NAME>>"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: <<CLUSTER_NAME>>
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: <<CLUSTER_NAME>>
  # cpuOptions.nestedVirtualization is a Karpenter v1.13+ field. Karpenter
  # forwards this into the launched instance's CpuOptions and additionally
  # rejects any instance type whose ProcessorInfo.SupportedFeatures does not
  # include "nested-virtualization". The set of supporting families is
  # maintained by EC2; see the AWS docs for the current list:
  # https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/amazon-ec2-nested-virtualization.html
  cpuOptions:
    nestedVirtualization: enabled
  tags:
    blueprint: nested-virtualization
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: nested-virt
spec:
  template:
    metadata:
      labels:
        blueprint: nested-virtualization
        # The kata-deploy DaemonSet is scoped to nodes with this label (via
        # the nodeSelector passed at helm install, see README step 2). It
        # installs the Kata runtime and containerd config on these nodes only.
        katacontainers.io/kata-runtime: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: nested-virt
      # Keeps workloads off a freshly provisioned node until kata-deploy has
      # finished installing the runtime. kata-deploy removes this taint as its
      # final install step (the chart's startupTaints value, README step 2),
      # closing the race where a Kata pod is scheduled before the runtime
      # binaries exist. Karpenter still provisions nodes for pods that don't
      # tolerate startup taints; the pods just wait for the taint's removal.
      startupTaints:
        - key: katacontainers.io/kata-runtime
          effect: NoSchedule
      # Explicit family pinning is not strictly required (Karpenter's
      # NestedVirtualizationFilter would narrow candidates for us), but
      # being explicit makes the blueprint's intent clear to readers and
      # mirrors the currently supported set from the AWS docs:
      # https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/amazon-ec2-nested-virtualization.html
      # Update this list if AWS adds more families.
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - c8i
            - c8id
            - c8i-flex
            - m8i
            - m8id
            - m8i-flex
            - r8i
            - r8id
            - r8i-flex
            - x8i
            - c7i
            - c7i-flex
            - m7i
            - m7i-flex
            - r7i
            - i7i
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: 720h
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
